name: Main build

on:
  workflow_dispatch: {}

  push: {}

  pull_request: {}

permissions:
  contents: read
  packages: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: 1

defaults:
  run:
    shell: pwsh

jobs:

  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            runtime: win-x64
          - os: ubuntu-latest
            runtime: linux-x64
      fail-fast: false

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Restore
        run:
          dotnet restore ./src/GitVersion.sln

      - name: Build
        run:
          dotnet build --no-restore ./src/GitVersion.sln

      # - name: Tests
      #   run:
      #     dotnet test `
      #       --no-build `
      #       -p:TestTfmsInParallel=false `
      #       ./src/GitVersion.sln

      - name: Publish
        run:
          dotnet publish `
            --configuration Release `
            --framework net6.0 `
            --runtime ${{ matrix.runtime }} `
            -p:PublishSingleFile=true `
            --self-contained false `
            --output ./output/ `
            ./src/GitVersion.App/GitVersion.App.csproj

      - name: Upload the built artifact
        uses: actions/upload-artifact@v4
        with:
          name: gitversion-${{ matrix.runtime }}
          path: './output/'
          retention-days: 14
          compression-level: 1
          overwrite: true
