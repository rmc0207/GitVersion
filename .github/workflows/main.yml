name: Main build

on:
  workflow_dispatch: {}

  push: {}

  pull_request: {}

permissions:
  contents: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: 1

defaults:
  run:
    shell: pwsh

jobs:

  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            runtime: win-x64
          - os: ubuntu-latest
            runtime: linux-x64
      fail-fast: false

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Version
        id: version
        run: |
          [string] $version = if ('${{ github.ref_type }}' -eq 'tag') {
              '${{ github.ref }}' -replace '^refs/tags/'
            } else { '0.0.1' }
          "version=${version}" | Out-File -Path $env:GITHUB_OUTPUT -Append -Encoding ascii

      - name: Restore
        run:
          dotnet restore ./src/GitVersion.sln

      - name: Build
        run: |
          dotnet build `
            --no-restore `
            -p:version=${{ steps.version.outputs.version }} `
            ./src/GitVersion.sln

      # - name: Tests
      #   run:
      #     dotnet test `
      #       --no-build `
      #       -p:TestTfmsInParallel=false `
      #       ./src/GitVersion.sln

      - name: Publish
        run:
          dotnet publish `
            --configuration Release `
            --framework net6.0 `
            --runtime ${{ matrix.runtime }} `
            -p:version=${{ steps.version.outputs.version }} `
            -p:PublishSingleFile=true `
            --self-contained false `
            --output ./output/ `
            ./src/GitVersion.App/GitVersion.App.csproj

      - name: Upload the built artifact
        uses: actions/upload-artifact@v4
        with:
          name: gitversion-${{ matrix.runtime }}-${{ steps.version.outputs.version }}
          path: './output/'
          retention-days: 14
          compression-level: 1
          overwrite: true

  release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Package artifacts
        run: |
          Get-ChildItem -Path . -Directory | ForEach-Object {
            Compress-Archive -Path $_.FullName -DestinationPath "./$($_.Name).zip" -CompressionLevel Fastest
          }

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          overwrite_files: true
          files: |
            *.zip
